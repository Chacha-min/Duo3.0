<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duo3.0</title><style>
:root{--navy:#173854;--blue:#28618e;--line:#d8e4ed;--ink:#1d2d3d;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}header{background:var(--navy);color:#fff;padding:18px max(20px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:22px;margin:0}.layout{max-width:1180px;margin:22px auto;padding:0 18px}.stats{display:grid;grid-template-columns:1.45fr repeat(3,1fr);gap:11px;margin-bottom:14px}.stats>div,.card,.panel,.examples{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 2px 10px #1738540a}.stats .main{background:#eaf4fb}.cap{font-size:12px;color:var(--muted);font-weight:700}.num{font-size:26px;font-weight:800;margin-top:4px}.num small{font-size:13px;color:var(--muted)}.card{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.card strong{font-size:15px}.tag{border-radius:999px;padding:4px 8px;background:#e9f5ef;color:#176c52;font-size:12px;font-weight:700}.note{font-size:12px;color:var(--muted)}label{font-size:13px;color:var(--muted);font-weight:700}select{margin-left:6px;padding:8px;border:1px solid #abc0cf;border-radius:7px;background:#fff;font:inherit;color:var(--ink);max-width:130px}button{border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:#fff;font-size:14px;font-weight:750;cursor:pointer}.outline,.pale{background:#fff;color:#24465f;border:1px solid #abc0cf}.danger{background:#fff1f1;color:#a03b3b;border:1px solid #edc3c3}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.examples{margin-bottom:14px}.examples h2,.panelHead h2{font-size:16px;margin:0}.examples p{margin:8px 0 0;line-height:1.6}.examples .ja{color:var(--muted);font-size:14px}.exampleItem{border-top:1px solid var(--line);padding:11px 0}.exampleItem:first-of-type{border:0}.panel{padding:0;overflow:hidden}.panelHead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.panelHead span{font-size:13px;color:var(--muted)}table{border-collapse:collapse;width:100%}th{background:#eef4f8;color:#3d586e;text-align:left;font-size:12px;padding:11px}td{padding:12px;border-top:1px solid var(--line);vertical-align:middle}tr.wrong{background:#fff8f4}.check{text-align:center;width:86px}.check input{width:20px;height:20px;accent-color:#e87832}.word{font-size:17px;font-weight:800}.exNo{font-weight:800;color:var(--blue);width:105px}.meaning{font-weight:600}.empty{padding:35px;text-align:center;color:var(--muted)}.hidden{display:none}@media(max-width:650px){header{padding:14px}.layout{padding:0 12px;margin:14px auto}.stats{grid-template-columns:1fr 1fr;gap:8px}.stats .main{grid-column:span 2}.stats>div{padding:12px}.num{font-size:22px}.card{padding:12px;gap:9px}.card strong{width:100%}.card label{width:calc(50% - 5px);display:flex;align-items:center;justify-content:space-between}.card select{width:100%;min-width:0}.card button{width:100%;min-height:44px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.controls button{padding:9px 6px;font-size:13px;min-height:44px}.panelHead span{display:none}.panel{overflow:visible}.panel table,.panel tbody,.panel tr,.panel td{display:block;width:100%}.panel thead{display:none}.panel tr{position:relative;padding:12px 12px 12px 60px;min-height:114px}.panel td{border:0;padding:0}.panel .check{position:absolute;left:12px;top:43px;width:auto}.panel .exNo{margin-bottom:6px}.panel .word{margin-bottom:6px}.panel .meaning{line-height:1.5}}
</style></head><body><header><h1>Duo3.0</h1><button class="pale" id="review">誤答リストを見る</button></header><main class="layout">
<section class="stats"><div class="main"><div class="cap">今回のテスト範囲</div><div class="num" id="range"></div></div><div><div class="cap">正解</div><div class="num" id="correct"></div></div><div><div class="cap">正解率</div><div class="num" id="rate"></div></div><div><div class="cap">要復習</div><div class="num" id="wrongCount"></div></div></section>
<section class="card"><strong>教材データ</strong><span class="tag">登録済み 2,569 / 2,569語</span><span class="note">Section 1〜45・例文 1〜560</span></section>
<section class="card"><strong>出題範囲</strong><label>例文開始 No.<select id="start"></select></label><span>〜</span><label>例文終了 No.<select id="end"></select></label><button id="apply">この範囲を選ぶ</button></section>
<section class="card"><strong>問題を作成</strong><label>問題数<select id="count"><option>10</option><option>20</option><option selected>30</option><option>40</option><option>50</option></select></label><label>表示<select id="mode"><option value="ja">日本語だけ（英単語を答える）</option><option value="en">英単語だけ（日本語訳を答える）</option></select></label><button id="make">シャッフル問題を作る</button><button class="outline" id="print">問題を印刷・PDF保存</button></section>
<div class="controls"><button id="show">今回の問題を表示</button><button class="outline" id="shuffle">問題の順番を再シャッフル</button><button class="outline" id="all">選択範囲の全単語を表示</button><button class="danger" id="clear">今回の誤答チェックを外す</button></div>
<section class="examples"><h2>選択範囲の例文</h2><div id="exampleRows"></div></section><section class="panel"><div class="panelHead"><h2 id="heading">解答確認リスト</h2><span>チェックした行は誤答として記録されます</span></div><table id="table"><thead><tr><th class="check">誤答</th><th>例文 No.</th><th>English</th><th>日本語（解答）</th></tr></thead><tbody id="rows"></tbody></table><div class="empty hidden" id="empty">まだ誤答はありません。</div></section></main><script src="duo-3-data.js"></script><script>
const data=window.DUO_DATA,words=data.words,examples=data.examples,$=x=>document.getElementById(x);let start=1,end=10,ids=words.filter(w=>w.exampleNo<=10).map(w=>w.id),order=[...ids],reviewOnly=false,wrong=new Set(JSON.parse(localStorage.getItem('duo3Wrong')||'[]'));const active=()=>words.filter(w=>ids.includes(w.id));function save(){localStorage.setItem('duo3Wrong',JSON.stringify([...wrong]))}function update(){let a=active(),n=a.filter(w=>wrong.has(w.id)).length,ok=a.length-n;$('range').innerHTML=`例文 ${start} - ${end} <small>${a.length}問</small>`;$('correct').innerHTML=`${ok} <small>/ ${a.length}</small>`;$('rate').innerHTML=`${a.length?Math.round(ok/a.length*100):0}<small>%</small>`;$('wrongCount').innerHTML=`${n} <small>語</small>`}function renderExamples(){let es=examples.filter(e=>e.no>=start&&e.no<=end);$('exampleRows').innerHTML=es.map(e=>`<div class="exampleItem"><span class="tag">例文 ${e.no}</span><p>${e.en}</p><p class="ja">${e.ja}</p></div>`).join('')}function render(){let list=order.map(id=>words[id-1]).filter(w=>ids.includes(w.id)&&(!reviewOnly||wrong.has(w.id)));$('rows').innerHTML=list.map(w=>`<tr class="${wrong.has(w.id)?'wrong':''}"><td class="check"><input type="checkbox" data-id="${w.id}" ${wrong.has(w.id)?'checked':''}></td><td class="exNo">例文 ${w.exampleNo}<br><span class="tag">Section ${w.section}</span></td><td class="word">${w.en}</td><td class="meaning">${w.ja}</td></tr>`).join('');$('table').classList.toggle('hidden',!list.length);$('empty').classList.toggle('hidden',!!list.length);$('heading').textContent=reviewOnly?'誤答の復習リスト':'解答確認リスト';$('review').textContent=reviewOnly?'今回の問題へ戻る':'誤答リストを見る';document.querySelectorAll('[data-id]').forEach(x=>x.onchange=()=>{let id=Number(x.dataset.id);x.checked?wrong.add(id):wrong.delete(id);save();update();render()})}function make(){let p=words.filter(w=>w.exampleNo>=start&&w.exampleNo<=end),n=Number($('count').value);if(p.length<n)return alert(`この範囲には ${p.length}語しかありません。問題数を減らすか、範囲を広げてください。`);ids=p.sort(()=>Math.random()-.5).slice(0,n).map(w=>w.id);order=[...ids];reviewOnly=false;update();render()}function printQuiz(){let side=$('mode').value,l=order.map(id=>words[id-1]).filter(w=>ids.includes(w.id)),win=window.open('','_blank');if(!win)return;win.document.write(`<!doctype html><meta charset="utf-8"><title>Duo3.0 単語テスト</title><style>body{font-family:sans-serif;margin:15mm}.q{padding:12px 0;border-bottom:1px solid #bbb;font-size:17px}.q b{color:#28618e}.q i{display:inline-block;border-bottom:1px solid #333;width:36%;margin-left:16px}</style><button onclick="print()">印刷 / PDFに保存</button><h1>Duo3.0</h1><p>例文 ${start}〜${end} ／ ${l.length}問</p>${l.map((w,i)=>`<div class="q"><b>${i+1}.</b> ${side==='ja'?w.ja:w.en}<i></i></div>`).join('')}`);win.document.close()}for(let n=1;n<=560;n++){let s=`例文 ${n}`;$('start').insertAdjacentHTML('beforeend',`<option value="${n}">${s}</option>`);$('end').insertAdjacentHTML('beforeend',`<option value="${n}">${s}</option>`)}$('end').value=10;$('apply').onclick=()=>{start=Number($('start').value);end=Number($('end').value);if(start>end)return alert('開始No.は終了No.以下にしてください。');ids=words.filter(w=>w.exampleNo>=start&&w.exampleNo<=end).map(w=>w.id);order=[...ids];reviewOnly=false;update();renderExamples();render()};$('make').onclick=make;$('print').onclick=printQuiz;$('show').onclick=()=>{reviewOnly=false;render()};$('shuffle').onclick=()=>{order.sort(()=>Math.random()-.5);render()};$('all').onclick=()=>{ids=words.filter(w=>w.exampleNo>=start&&w.exampleNo<=end).map(w=>w.id);order=[...ids];reviewOnly=false;update();render()};$('review').onclick=()=>{reviewOnly=!reviewOnly;render()};$('clear').onclick=()=>{active().forEach(w=>wrong.delete(w.id));save();update();render()};update();renderExamples();render();
</script></body></html>
